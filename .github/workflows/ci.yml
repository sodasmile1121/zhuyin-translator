name: Python Worker CI

# 💥 觸發時機：什麼時候要叫雲端電腦出來幹活？
on:
  push:
    branches: [ "feat/stream-queue", "master" ] # 當這兩個分支有 push 時
  pull_request:
    branches: [ "master" ]

# 🏗️ 實體任務：雲端電腦要做什麼？
jobs:
  python-lint:
    # 叫一台裝有最新 Ubuntu Linux 的雲端虛擬機出來
    runs-on: ubuntu-latest

    steps:
    # Step 1: 把你在 GitHub 上的程式碼「複製（Checkout）」到這台雲端電腦上
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: 在雲端電腦上安裝 Python 環境
    - name: Set up Python
      uses: actions/checkout@v4
      with:
        python-version: '3.10'

    # Step 3: 安裝語法檢查工具 (flake8)
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    # Step 4: 物理執行語法檢查！檢查你的 worker.py 有沒有低級錯誤
    - name: Run Lint Check
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 python-worker/worker.py --count --select=E9,F63,F7,F82 --show-source --statistics