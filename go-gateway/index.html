<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生字注音分析系統 - 清新智慧版</title>
    <style>
        :root {
            --bg-main: #f4f6f3;       /* 日系微冷淡淡綠灰 */
            --bg-card: #ffffff;       /* 純白高質感卡片 */
            --bg-input: #fafbfc;
            --border-color: #e2e8f0;   /* 輕量級邊框 */
            --text-main: #2d3748;     /* 溫和的深灰（比純黑優雅） */
            --text-muted: #718096;    /* 舒適的中灰 */
            --primary-glow: linear-gradient(135deg, #6ee7b7 0%, #3b82f6 100%); /* 輕薄荷到天藍 */
            --ruby-color: #059669;    /* 護眼翡翠綠注音 */
            --card-shadow: 0 10px 30px rgba(148, 163, 184, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 840px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* 上傳控制區塊 */
        .upload-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            margin-bottom: 35px;
        }

        .file-dropzone {
            border: 2px dashed #cbd5e1;
            padding: 50px 20px;
            border-radius: 16px;
            text-align: center;
            background: var(--bg-input);
            cursor: pointer;
            display: block;
            transition: all 0.25s ease;
        }

        .file-dropzone:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.02);
        }

        .file-dropzone icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 15px;
        }

        .file-dropzone input[type="file"] {
            display: none;
        }

        .file-dropzone strong {
            color: #1e293b;
            font-size: 1.15rem;
            display: block;
        }

        .file-dropzone span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-top: 8px;
        }

        .file-count-tip {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #059669;
            font-weight: 600;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: #1e293b; /* 內斂的高級黑色按鈕 */
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 14px;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
        }

        /* 檔案處理區塊卡片 */
        .file-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-card h3 {
            font-size: 1.15rem;
            color: #1a202c;
            margin-bottom: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 70%; /* 防止名字過長塞車 */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 檔案狀態標籤 */
        .status-badge {
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 30px;
            font-weight: 600;
        }
        .status-badge.waiting {
            background: #fef08a;
            color: #713f12;
            animation: pulse 1.5s infinite;
        }
        .status-badge.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .preview-box {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 20px;
            border: 1px solid #f1f5f9;
            line-height: 1.6;
        }
        
        .preview-box strong { color: #1e293b; }

        /* 注音網格 */
        .words-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .word-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 8px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(148, 163, 184, 0.03);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .word-badge:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.08);
        }

        ruby {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            ruby-position: over;
        }

        rt {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ruby-color);
            padding-bottom: 4px;
            letter-spacing: 2px;
            font-family: "Bopomofo", -apple-system, sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 AI 生字注音分析</h1>
            <p>上傳 PDF 文件，自動解析文字結構並呈現精美注音排版</p>
        </header>
        
        <div class="upload-card">
            <form id="uploadForm">
                <label class="file-dropzone" id="dropzone">
                    <icon>🌱</icon>
                    <strong>點擊或拖曳 PDF 至此處</strong>
                    <span>支援多檔案同時上傳、自動對帳與即時推播機制</span>
                    <div class="file-count-tip" id="fileCountTip"></div>
                    <input type="file" id="fileInput" name="files" multiple required accept="application/pdf">
                </label>
                <button type="submit" class="btn-submit">執行智慧分析</button>
            </form>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileCountTip = document.getElementById('fileCountTip');
        const resultsDiv = document.getElementById('results');

        let activeSockets = {};

        fileInput.onchange = () => {
            const count = fileInput.files.length;
            fileCountTip.textContent = count > 0 ? `✓ 已準備好 ${count} 個檔案` : '';
        };

        form.onsubmit = async (e) => {
            e.preventDefault(); 
            
            Object.values(activeSockets).forEach(ws => ws.close());
            activeSockets = {};
            resultsDiv.innerHTML = '';

            const formData = new FormData(form);

            try {
                const response = await fetch(`${window.location.origin}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const jobList = await response.json();
                if (!response.ok) throw new Error(jobList.error || "後端派發任務失敗");

                if (Array.isArray(jobList) && jobList.length > 0) {
                    jobList.forEach(job => {
                        createJobCard(job.job_id, job.file_path);
                        startSmartTracking(job.job_id);
                    });
                }
            } catch (error) {
                alert("上傳發生錯誤：" + error.message);
            }
        };

        function createJobCard(jobId, filePath) {
            // 🎯 核心修復：使用 Regex 強行切除 S3 URL 的 ?X-Amz-Algorithm... 之後的所有恐怖參數，並且洗掉 UUID 前綴
            let cleanName = filePath.split('/').pop().split('?')[0];
            cleanName = cleanName.replace(/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}_/, '');
            
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = `card-${jobId}`; 
            card.innerHTML = `
                <h3>
                    <span class="file-name-wrapper" title="${cleanName}">📄 ${cleanName}</span>
                    <span class="status-badge waiting" id="badge-${jobId}">AI 分析中...</span>
                </h3>
                <div class="preview-box" id="preview-${jobId}">
                    <strong>任務 ID：</strong><code>${jobId}</code><br>
                    <strong>儲存狀態：</strong><small style="color:#64748b;">已安全分發至雲端叢集</small>
                </div>
                <div class="words-container" id="words-${jobId}"></div>
            `;
            resultsDiv.appendChild(card);
        }

        function startSmartTracking(jobId) {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws?job_id=${jobId}`);
            activeSockets[jobId] = ws;

            ws.onmessage = async (event) => {
                try {
                    const resData = JSON.parse(event.data);

                    if (resData.status === 'failed' || resData.status === 'fail') {
                        renderFailure(jobId, resData.error || "Python 處理異常");
                        ws.close();
                        return;
                    }

                    if (resData.status === 'success' || resData.char_zy) {
                        console.log(`⚡ [WS 觸發] 捕獲完工訊號，準備向 /status 拉取完整內容。任務 ID: ${jobId}`);
                        ws.close(); 
                        fetchAndRenderResult(jobId);
                    }
                } catch (err) {
                    console.error("WS 訊息解析失敗", err);
                }
            };

            ws.onerror = async () => {
                console.error(`💥 [WS 異常] 任務 ${jobId} 無法建立即時通道，啟動防禦性單次對帳。`);
                fetchAndRenderResult(jobId);
            };
        }

        async function fetchAndRenderResult(jobId) {
            try {
                const response = await fetch(`${window.location.origin}/status?job_id=${jobId}`);
                const finalResult = await response.json();
                
                if (finalResult.status === 'processing') {
                    console.warn(`⏳ 任務 ${jobId} 目前仍在 AI 隊列中，請等待重新整理或通知。`);
                    return;
                }

                if (finalResult.status === 'failed' || finalResult.status === 'fail') {
                    renderFailure(jobId, finalResult.error || "未知錯誤");
                    return;
                }

                renderSuccessHTML(jobId, finalResult);
            } catch (fetchErr) {
                console.error("HTTP GET 獲取大資料失敗:", fetchErr);
                renderFailure(jobId, "連線中斷，請重新整理網頁");
            }
        }

        function renderSuccessHTML(jobId, data) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            const wordsContainer = document.getElementById(`words-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge success';
            badge.innerText = '分析完成';

            // 📥 溫和高質感的下載按鈕
            preview.innerHTML = `
                <strong>🌱 文本前瞻摘要：</strong>已順利解析完成，注音生字網格已渲染。<br><br>
                <a href="${window.location.origin}/download?job_id=${jobId}"
                   style="display:inline-flex; align-items:center; background: #059669; color:#ffffff; padding:12px 24px; border-radius:12px; text-decoration:none; font-weight:600; font-size:0.9rem; margin-top:5px; transition:all 0.2s ease;"
                   onmouseover="this.style.background='#047857'; this.style.transform='translateY(-1px)';" 
                   onmouseout="this.style.background='#059669'; this.style.transform='translateY(0)';"
                >
                   📥 下載完整注音標註 PDF
                </a>
            `;

            if (data.char_zy && Array.isArray(data.char_zy)) {
                wordsContainer.innerHTML = data.char_zy.map(item => `
                    <div class="word-badge">
                        <ruby>${item.char}<rt>${item.zy || '&nbsp;'}</rt></ruby>
                    </div>
                `).join('');
            } else {
                wordsContainer.innerHTML = '<p style="color:var(--text-muted); padding:10px;">無有效生字注音資料</p>';
            }
        }

        function renderFailure(jobId, reason) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge failed';
            badge.innerText = '分析失敗';
            preview.innerHTML += `<br><span style="color:#b91c1c;">❌ 錯誤原因：${reason}</span>`;
        }
    </script>
</body>
</html>
