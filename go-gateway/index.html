<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生字注音分析系統 - 智慧併發版</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a2c;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-glow: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            --ruby-color: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* 控制區塊 */
        .upload-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
        }

        .file-dropzone {
            border: 2px dashed #475569;
            padding: 45px 20px;
            border-radius: 14px;
            text-align: center;
            background: rgba(30, 41, 59, 0.4);
            cursor: pointer;
            display: block;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .file-dropzone:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.06);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.1);
        }

        .file-dropzone icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        .file-dropzone input[type="file"] {
            display: none;
        }

        .file-dropzone strong {
            color: #f1f5f9;
            font-size: 1.1rem;
        }

        .file-dropzone span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-top: 5px;
        }

        .file-count-tip {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-glow);
            color: #0f172a;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
            transform: translateY(-1px);
        }

        /* 檔案處理區塊卡片 */
        .file-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-card h3 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 16px;
            font-weight: 700;
            border-left: 4px solid #818cf8;
            padding-left: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 檔案狀態標籤 */
        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-badge.waiting {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.3);
            animation: pulse 1.5s infinite;
        }
        .status-badge.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-badge.failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .preview-box {
            background: #1e293b;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .preview-box strong { color: #cbd5e1; }

        /* 注音網格 */
        .words-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 14px;
            margin-top: 15px;
        }

        .word-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .word-badge:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #475569;
            transform: translateY(-3px);
        }

        ruby {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            ruby-position: over;
        }

        rt {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--ruby-color);
            padding-bottom: 6px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 AI 生字注音分析</h1>
            <p>上傳 PDF 文件，自動解析文字結構並呈現精美注音排版</p>
        </header>
        
        <div class="upload-card">
            <form id="uploadForm">
                <label class="file-dropzone" id="dropzone">
                    <icon>⚡</icon>
                    <strong>點擊或拖曳 PDF 至此處</strong>
                    <span>支援多檔案同時上傳、同步非同步排隊處理</span>
                    <div class="file-count-tip" id="fileCountTip"></div>
                    <input type="file" id="fileInput" name="files" multiple required accept="application/pdf">
                </label>
                <button type="submit" class="btn-submit">執行智慧分析</button>
            </form>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileCountTip = document.getElementById('fileCountTip');
        const resultsDiv = document.getElementById('results');

        // 用來追蹤儲存所有正在執行的輪詢計時器，避免鬼影重疊
        let activeIntervals = {};

        fileInput.onchange = () => {
            const count = fileInput.files.length;
            fileCountTip.textContent = count > 0 ? `✓ 已準備好 ${count} 個檔案` : '';
        };

        form.onsubmit = async (e) => {
            e.preventDefault(); 
            
            // 清除前一次的所有舊計時器與舊畫面
            Object.values(activeIntervals).forEach(clearInterval);
            activeIntervals = {};
            resultsDiv.innerHTML = '';

            const formData = new FormData(form);

            try {
                // 1. 打向 Go 後端優化過後的 /upload 接口
                const response = await fetch('http://localhost:8080/upload', {
                    method: 'POST',
                    body: formData
                });

                // 2. 拿到 Go 回傳的 []JobInfo 陣列
                const jobList = await response.json();

                if (!response.ok) {
                    throw new Error(jobList.error || "後端派發任務失敗");
                }

                if (Array.isArray(jobList) && jobList.length > 0) {
                    // 3. 為每一個任務在畫面上創建獨立的卡片骨架
                    jobList.forEach(job => {
                        createJobCard(job.job_id, job.file_path);
                        // 4. 為該任務啟動專屬的獨立 Polling 機制
                        startPolling(job.job_id);
                    });
                }

            } catch (error) {
                alert("上傳發生錯誤：" + error.message);
            }
        };

        // 🏗️ 在畫面上先幫任務佔位子，展現排隊中動態
        function createJobCard(jobId, filePath) {
            const fileName = filePath.split('/').pop().replace(/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}_/, '');
            
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = `card-${jobId}`; // 用 ID 鎖定這張卡片
            card.innerHTML = `
                <h3>
                    <span>📄 ${fileName}</span>
                    <span class="status-badge waiting" id="badge-${jobId}">AI 排隊分析中...</span>
                </h3>
                <div class="preview-box" id="preview-${jobId}">
                    <strong>任務 ID：</strong><code>${jobId}</code><br>
                    <strong>儲存路徑：</strong><small style="font-family: monospace; color:#64748b;">${filePath}</small>
                </div>
                <div class="words-container" id="words-${jobId}"></div>
            `;
            resultsDiv.appendChild(card);
        }

        // ⏱️ 每個任務獨立擁有的輪詢時鐘
        function startPolling(jobId) {
            activeIntervals[jobId] = setInterval(async () => {
                try {
                    const response = await fetch(`http://localhost:8080/status?job_id=${jobId}`);
                    const resData = await response.json();

                    const badge = document.getElementById(`badge-${jobId}`);
                    const preview = document.getElementById(`preview-${jobId}`);
                    const wordsContainer = document.getElementById(`words-${jobId}`);

                    // 防禦性檢查：萬一使用者狂點導致卡片不小心不見了
                    if (!badge) return;

                    // 狀況 A：Python 還在算
                    if (resData.status === 'processing') {
                        console.log(`Job ${jobId} 仍在分析中...`);
                        return;
                    }

                    // 狀況 B：Python 回報這張單死掉了
                    if (resData.status === 'failed') {
                        clearInterval(activeIntervals[jobId]);
                        badge.className = 'status-badge failed';
                        badge.innerText = '分析失敗';
                        preview.innerHTML += `<br><span style="color:#ef4444;">❌ 錯誤原因：${resData.error || '未知錯誤'}</span>`;
                        return;
                    }

                    // 狀況 C：這張單算完了！收割成果！
                    clearInterval(activeIntervals[jobId]);
                    badge.className = 'status-badge success';
                    badge.innerText = '完成';

                    // 更新預覽訊息
                    preview.innerHTML = `<strong>📄 文本摘要前瞻：</strong>${resData.preview || '已順利完成注音標註'}`;

                    // 渲染注音格子
                    let wordsHTML = '';
                    if (resData.char_zy && Array.isArray(resData.char_zy)) {
                        resData.char_zy.forEach(item => {
                            wordsHTML += `
                                <div class="word-badge">
                                    <ruby>${item.char}<rt>${item.zy || '&nbsp;'}</rt></ruby>
                                </div>
                            `;
                        });
                    } else {
                        wordsHTML = '<p style="color:var(--text-muted); padding:10px;">Python 回傳資料格式不包含 char_zy</p>';
                    }
                    wordsContainer.innerHTML = wordsHTML;

                } catch (err) {
                    console.error(`輪詢 Job ${jobId} 時連線中斷:`, err);
                }
            }, 1000); // 每秒敲一次門
        }
    </script>
</body>
</html>
