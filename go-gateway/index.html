<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生字注音分析系統 - 智慧併發版</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a2c;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-glow: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            --ruby-color: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* 控制區塊 */
        .upload-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
        }

        .file-dropzone {
            border: 2px dashed #475569;
            padding: 45px 20px;
            border-radius: 14px;
            text-align: center;
            background: rgba(30, 41, 59, 0.4);
            cursor: pointer;
            display: block;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .file-dropzone:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.06);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.1);
        }

        .file-dropzone icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        .file-dropzone input[type="file"] {
            display: none;
        }

        .file-dropzone strong {
            color: #f1f5f9;
            font-size: 1.1rem;
        }

        .file-dropzone span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-top: 5px;
        }

        .file-count-tip {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-glow);
            color: #0f172a;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
            transform: translateY(-1px);
        }

        /* 檔案處理區塊卡片 */
        .file-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-card h3 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 16px;
            font-weight: 700;
            border-left: 4px solid #818cf8;
            padding-left: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 檔案狀態標籤 */
        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-badge.waiting {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.3);
            animation: pulse 1.5s infinite;
        }
        .status-badge.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-badge.failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .preview-box {
            background: #1e293b;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .preview-box strong { color: #cbd5e1; }

        /* 注音網格 */
        .words-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 14px;
            margin-top: 15px;
        }

        .word-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .word-badge:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #475569;
            transform: translateY(-3px);
        }

        ruby {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            ruby-position: over;
        }

        rt {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--ruby-color);
            padding-bottom: 6px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 AI 生字注音分析</h1>
            <p>上傳 PDF 文件，自動解析文字結構並呈現精美注音排版</p>
        </header>
        
        <div class="upload-card">
            <form id="uploadForm">
                <label class="file-dropzone" id="dropzone">
                    <icon>⚡</icon>
                    <strong>點擊或拖曳 PDF 至此處</strong>
                    <span>支援多檔案同時上傳、自動對帳與即時推播機制</span>
                    <div class="file-count-tip" id="fileCountTip"></div>
                    <input type="file" id="fileInput" name="files" multiple required accept="application/pdf">
                </label>
                <button type="submit" class="btn-submit">執行智慧分析</button>
            </form>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileCountTip = document.getElementById('fileCountTip');
        const resultsDiv = document.getElementById('results');

        // 資源追蹤器，防範連線鬼影
        let activeSockets = {};

        fileInput.onchange = () => {
            const count = fileInput.files.length;
            fileCountTip.textContent = count > 0 ? `✓ 已準備好 ${count} 個檔案` : '';
        };

        form.onsubmit = async (e) => {
            e.preventDefault(); 
            
            // 清理舊連線與卡片
            Object.values(activeSockets).forEach(ws => ws.close());
            activeSockets = {};
            resultsDiv.innerHTML = '';

            const formData = new FormData(form);

            try {
                const response = await fetch('http://localhost:8080/upload', {
                    method: 'POST',
                    body: formData
                });

                const jobList = await response.json();
                if (!response.ok) throw new Error(jobList.error || "後端派發任務失敗");

                if (Array.isArray(jobList) && jobList.length > 0) {
                    jobList.forEach(job => {
                        createJobCard(job.job_id, job.file_path);
                        // 🎯 直接啟動智慧追蹤（靠 WS 監聽與後端主動對帳）
                        startSmartTracking(job.job_id);
                    });
                }
            } catch (error) {
                alert("上傳發生錯誤：" + error.message);
            }
        };

        function createJobCard(jobId, filePath) {
            const fileName = filePath.split('/').pop().replace(/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}_/, '');
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = `card-${jobId}`; 
            card.innerHTML = `
                <h3>
                    <span>📄 ${fileName}</span>
                    <span class="status-badge waiting" id="badge-${jobId}">AI 分析中...</span>
                </h3>
                <div class="preview-box" id="preview-${jobId}">
                    <strong>任務 ID：</strong><code>${jobId}</code><br>
                    <strong>儲存路徑：</strong><small style="font-family: monospace; color:#64748b;">${filePath}</small>
                </div>
                <div class="words-container" id="words-${jobId}"></div>
            `;
            resultsDiv.appendChild(card);
        }

        // 🧠 核心事件驅動中心
        function startSmartTracking(jobId) {
            const ws = new WebSocket(`ws://localhost:8080/ws?job_id=${jobId}`);
            activeSockets[jobId] = ws;

            ws.onmessage = async (event) => {
                try {
                    const resData = JSON.parse(event.data);

                    // 🛑 情況 A：收到失敗訊號（或是補發回來的歷史失敗資料）
                    if (resData.status === 'failed' || resData.status === 'fail') {
                        renderFailure(jobId, resData.error || "Python 處理異常");
                        ws.close();
                        return;
                    }

                    // 🟢 情況 B：不論是即時 Stream 推播，還是進網頁時 Go 從 `fetchJobResult` 撈出來的補發
                    // 只要狀態是完工（或帶有渲染結構），立刻執行非同步黃金三部曲第二步：向 /status 請求大數據
                    if (resData.status === 'success' || resData.char_zy) {
                        console.log(`⚡ [WS 觸發] 捕獲完工訊號，準備向 /status 拉取完整內容。任務 ID: ${jobId}`);
                        ws.close(); // 通知已安全收到，中斷管子釋放後端 Go 的暫存資源
                        
                        // 叫醒前端，精準叫一次 /status 撈取大資料渲染畫面
                        fetchAndRenderResult(jobId);
                    }
                } catch (err) {
                    console.error("WS 訊息解析失敗", err);
                }
            };

            ws.onclose = () => {
                // 當後端主動 conn.Close() 時會觸發此處，代表系統運行非常安全健康。
                console.log(`🔌 [WS 關閉] 任務 ${jobId} 的 WebSocket 通道安全關閉。`);
            };

            ws.onerror = async () => {
                console.error(`💥 [WS 異常] 任務 ${jobId} 無法建立即時通道，啟動防禦性單次對帳。`);
                // 唯一的防禦性兜底：如果連線那一秒剛好網路炸了，前端防禦性打一次 status 對帳，絕不陷入無腦輪詢！
                fetchAndRenderResult(jobId);
            };
        }

        // 📥 非同步黃金三部曲第二步：發起 HTTP GET 請求完整大數據並渲染
        async function fetchAndRenderResult(jobId) {
            try {
                const response = await fetch(`http://localhost:8080/status?job_id=${jobId}`);
                const finalResult = await response.json();
                
                // 如果是防禦性對帳被觸發，且後端表示仍在排隊中，則維持卡片原狀不渲染
                if (finalResult.status === 'processing') {
                    console.warn(`⏳ 任務 ${jobId} 目前仍在 AI 隊列中，請等待重新整理或通知。`);
                    return;
                }

                if (finalResult.status === 'failed' || finalResult.status === 'fail') {
                    renderFailure(jobId, finalResult.error || "未知錯誤");
                    return;
                }

                // 成功拿回大滿漢全席，直接擺盤渲染！
                renderSuccessHTML(jobId, finalResult);
            } catch (fetchErr) {
                console.error("HTTP GET 獲取大資料失敗:", fetchErr);
                renderFailure(jobId, "連線中斷，請重新整理網頁");
            }
        }

        // 🎨 渲染成功畫面
        function renderSuccessHTML(jobId, data) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            const wordsContainer = document.getElementById(`words-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge success';
            badge.innerText = '分析完成';

            // 📥 注入動態漸層的 PDF 下載按鈕（非同步黃金三部曲第三步：直接呼叫 /download）
            preview.innerHTML = `
                <strong>📄 文本前瞻摘要：</strong>已順利解析完成，注音生字網格已渲染。<br><br>
                <a href="http://localhost:8080/download?job_id=${jobId}" 
                   style="display:inline-flex; align-items:center; background: linear-gradient(135deg, #34d399 0%, #059669 100%); color:#0b0f19; padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:700; font-size:0.9rem; margin-top:5px; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.2); transition:all 0.2s ease;"
                   onmouseover="this.style.opacity=0.9; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 20px rgba(52, 211, 153, 0.4)';" 
                   onmouseout="this.style.opacity=1; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(52, 211, 153, 0.2)';"
                >
                   📥 下載完整注音標註 PDF
                </a>
            `;

            if (data.char_zy && Array.isArray(data.char_zy)) {
                wordsContainer.innerHTML = data.char_zy.map(item => `
                    <div class="word-badge">
                        <ruby>${item.char}<rt>${item.zy || '&nbsp;'}</rt></ruby>
                    </div>
                `).join('');
            } else {
                wordsContainer.innerHTML = '<p style="color:var(--text-muted); padding:10px;">無有效生字注音資料</p>';
            }
        }

        // 🎨 渲染失敗畫面
        function renderFailure(jobId, reason) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge failed';
            badge.innerText = '分析失敗';
            preview.innerHTML += `<br><span style="color:#ef4444;">❌ 錯誤原因：${reason}</span>`;
        }
    </script>
</body>
</html>
