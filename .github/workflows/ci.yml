name: Full System CI/CD

on:
  push:
    branches: [ "feat/stream-queue", "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  python-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Lint Check
      run: |
        flake8 python-worker/worker.py --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push-docker:
    needs: python-lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./python-worker/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/python-worker:latest
          ghcr.io/${{ github.repository }}/python-worker:${{ github.sha }}

  build-and-push-gateway:
    needs: python-lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Go Gateway Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./go-gateway/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/go-gateway:latest
          ghcr.io/${{ github.repository }}/go-gateway:${{ github.sha }}