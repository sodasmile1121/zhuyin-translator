<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生字注音分析系統 - 智慧併發版</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a2c;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-glow: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            --ruby-color: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* 控制區塊 */
        .upload-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
        }

        .file-dropzone {
            border: 2px dashed #475569;
            padding: 45px 20px;
            border-radius: 14px;
            text-align: center;
            background: rgba(30, 41, 59, 0.4);
            cursor: pointer;
            display: block;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .file-dropzone:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.06);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.1);
        }

        .file-dropzone icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        .file-dropzone input[type="file"] {
            display: none;
        }

        .file-dropzone strong {
            color: #f1f5f9;
            font-size: 1.1rem;
        }

        .file-dropzone span {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-top: 5px;
        }

        .file-count-tip {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-glow);
            color: #0f172a;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
            transform: translateY(-1px);
        }

        /* 檔案處理區塊卡片 */
        .file-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-card h3 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 16px;
            font-weight: 700;
            border-left: 4px solid #818cf8;
            padding-left: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 檔案狀態標籤 */
        .status-badge {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-badge.waiting {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.3);
            animation: pulse 1.5s infinite;
        }
        .status-badge.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-badge.failed {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .preview-box {
            background: #1e293b;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .preview-box strong { color: #cbd5e1; }

        /* 注音網格 */
        .words-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 14px;
            margin-top: 15px;
        }

        .word-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        
        .word-badge:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #475569;
            transform: translateY(-3px);
        }

        ruby {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            ruby-position: over;
        }

        rt {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--ruby-color);
            padding-bottom: 6px;
            letter-spacing: 1.5px;
		}
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 AI 生字注音分析</h1>
            <p>上傳 PDF 文件，自動解析文字結構並呈現精美注音排版</p>
        </header>
        
        <div class="upload-card">
            <form id="uploadForm">
                <label class="file-dropzone" id="dropzone">
                    <icon>⚡</icon>
                    <strong>點擊或拖曳 PDF 至此處</strong>
                    <span>支援多檔案同時上傳、同步非同步排隊處理</span>
                    <div class="file-count-tip" id="fileCountTip"></div>
                    <input type="file" id="fileInput" name="files" multiple required accept="application/pdf">
                </label>
                <button type="submit" class="btn-submit">執行智慧分析</button>
            </form>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileCountTip = document.getElementById('fileCountTip');
        const resultsDiv = document.getElementById('results');

        // 管理活動中的資源，避免多重計時器或連線鬼影
        let activeSockets = {};
        let activeIntervals = {};
        let fallbackTimers = {};

        fileInput.onchange = () => {
            const count = fileInput.files.length;
            fileCountTip.textContent = count > 0 ? `✓ 已準備好 ${count} 個檔案` : '';
        };

        form.onsubmit = async (e) => {
            e.preventDefault(); 
            
            // 全面重置：清除所有活動中的 WS 連線、輪詢計時器、保險定時器
            Object.values(activeSockets).forEach(ws => ws.close());
            Object.values(activeIntervals).forEach(clearInterval);
            Object.values(fallbackTimers).forEach(clearTimeout);
            activeSockets = {};
            activeIntervals = {};
            fallbackTimers = {};
            resultsDiv.innerHTML = '';

            const formData = new FormData(form);

            try {
                const response = await fetch('http://localhost:8080/upload', {
                    method: 'POST',
                    body: formData
                });

                const jobList = await response.json();
                if (!response.ok) throw new Error(jobList.error || "後端派發任務失敗");

                if (Array.isArray(jobList) && jobList.length > 0) {
                    jobList.forEach(job => {
                        createJobCard(job.job_id, job.file_path);
                        // 🔥 執行你的核心雙軌制：啟動監聽，並設定 1 秒後沒動靜啟動輪詢
                        startSmartTracking(job.job_id);
                    });
                }
            } catch (error) {
                alert("上傳發生錯誤：" + error.message);
            }
        };

        function createJobCard(jobId, filePath) {
            const fileName = filePath.split('/').pop().replace(/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}_/, '');
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = `card-${jobId}`; 
            card.innerHTML = `
                <h3>
                    <span>📄 ${fileName}</span>
                    <span class="status-badge waiting" id="badge-${jobId}">AI 排隊分析中...</span>
                </h3>
                <div class="preview-box" id="preview-${jobId}">
                    <strong>任務 ID：</strong><code>${jobId}</code><br>
                    <strong>儲存路徑：</strong><small style="font-family: monospace; color:#64748b;">${filePath}</small>
                </div>
                <div class="words-container" id="words-${jobId}"></div>
            `;
            resultsDiv.appendChild(card);
        }

        // 🧠 核心雙軌控制中心
        function startSmartTracking(jobId) {
            // 軌道一：優先建立 WebSocket 監聽
            connectJobWebSocket(jobId);

            // 軌道二：🔥 保險定時炸彈（設定 1000 毫秒 = 1 秒）
            fallbackTimers[jobId] = setTimeout(() => {
                const badge = document.getElementById(`badge-${jobId}`);
                // 如果 1 秒到了，畫面依然在「排隊分析中...」，代表 WS 被丟包或延遲了，立刻啟動輪詢保險！
                if (badge && badge.classList.contains('waiting') && !activeIntervals[jobId]) {
                    console.warn(`⏳ [Fallback] 任務 ${jobId} 超過 1 秒未收到 WS 推播，切換至主動輪詢模式！`);
                    badge.innerText = "AI 分析中 (已啟動輪詢保險)...";
                    
                    // 關閉可能已經卡住的 WS 連線
                    if (activeSockets[jobId]) {
                        activeSockets[jobId].close();
                    }
                    
                    // 啟動主動輪詢
                    startPollingFallback(jobId);
                }
            }, 1000);
        }

        // 🔗 軌道一：WebSocket 輕量監聽器
        function connectJobWebSocket(jobId) {
            const ws = new WebSocket(`ws://localhost:8080/ws?job_id=${jobId}`);
            activeSockets[jobId] = ws;

            ws.onmessage = async (event) => {
                try {
                    const resData = JSON.parse(event.data);

                    // 🛑 情況 A：收到 Python 通知失敗
                    if (resData.status === 'failed' || resData.status === 'fail') {
                        clearTimeout(fallbackTimers[jobId]); // 拆除炸彈
                        renderFailure(jobId, "Python 處理異常");
                        ws.close();
                        return;
                    }

                    // 🟢 情況 B：收到 Python 通知成功
                    if (resData.status === 'success') {
                        console.log(`⚡ [WebSocket] 秒殺通知成功！任務 ${jobId} 已完成。`);
                        clearTimeout(fallbackTimers[jobId]); // 拆除炸彈
                        ws.close();
                        
                        // 收到狀態 success，立刻去拉取真正的數據
                        fetchAndRenderResult(jobId);
                    }
                } catch (err) {
                    console.error("WS 訊息解析失敗，等待保險觸發", err);
                }
            };

            ws.onerror = () => {
                // 如果 WS 一開始就連不上，不用等 1 秒，立刻拆除炸彈直接進輪詢
                clearTimeout(fallbackTimers[jobId]);
                if (!activeIntervals[jobId]) {
                    console.log(`🔌 [WS 異常] 任務 ${jobId} 連線失敗，提早切換至輪詢保險。`);
                    startPollingFallback(jobId);
                }
            };
        }

        // ⏱️ 軌道二：主動輪詢保險機制（每秒去敲一次門）
        function startPollingFallback(jobId) {
            activeIntervals[jobId] = setInterval(async () => {
                try {
                    const response = await fetch(`http://localhost:8080/status?job_id=${jobId}`);
                    const resData = await response.json();

                    // 狀況 A：仍在處理中，繼續等
                    if (resData.status === 'processing') {
                        console.log(`⏱️ [Polling] 任務 ${jobId} 仍在分析中...`);
                        return;
                    }

                    // 狀況 B：失敗了
                    if (resData.status === 'failed' || resData.status === 'fail') {
                        clearInterval(activeIntervals[jobId]);
                        renderFailure(jobId, resData.error || "未知錯誤");
                        return;
                    }

                    // 狀況 C：成功了！直接拿結果渲染（因為 /status 本來就包含完整大資料）
                    clearInterval(activeIntervals[jobId]);
                    console.log(`🎉 [Polling] 輪詢成功捕獲結果！任務 ${jobId} 已渲染。`);
                    renderSuccessHTML(jobId, resData);

                } catch (err) {
                    console.error(`輪詢任務 ${jobId} 發生網路錯誤:`, err);
                }
            }, 1000);
        }

        // 📥 獨立抽離：發起 HTTP GET 請求完整大數據並渲染
        async function fetchAndRenderResult(jobId) {
            try {
                const response = await fetch(`http://localhost:8080/status?job_id=${jobId}`);
                const finalResult = await response.json();
                renderSuccessHTML(jobId, finalResult);
            } catch (fetchErr) {
                console.error("HTTP GET 獲取大資料失敗:", fetchErr);
                renderFailure(jobId, "資料載入失敗");
            }
        }

        // 🎨 渲染成功畫面
        function renderSuccessHTML(jobId, data) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            const wordsContainer = document.getElementById(`words-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge success';
            badge.innerText = '完成';

            // 📥 注入動態漸層的 PDF 下載按鈕，直接呼叫 Go 網關
            preview.innerHTML = `
                <strong>📄 文本摘要前瞻：</strong>${data.preview || '已順利完成注音標註'}<br><br>
                <a href="http://localhost:8080/download?job_id=${jobId}" 
                   style="display:inline-flex; align-items:center; background: linear-gradient(135deg, #34d399 0%, #059669 100%); color:#0b0f19; padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:700; font-size:0.9rem; margin-top:5px; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.2); transition:all 0.2s ease;"
                   onmouseover="this.style.opacity=0.9; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 20px rgba(52, 211, 153, 0.4)';" 
                   onmouseout="this.style.opacity=1; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(52, 211, 153, 0.2)';"
                >
                   📥 下載完整注音 PDF
                </a>
            `;

            if (data.char_zy && Array.isArray(data.char_zy)) {
                wordsContainer.innerHTML = data.char_zy.map(item => `
                    <div class="word-badge">
                        <ruby>${item.char}<rt>${item.zy || '&nbsp;'}</rt></ruby>
                    </div>
                `).join('');
            } else {
                wordsContainer.innerHTML = '<p style="color:var(--text-muted); padding:10px;">無有效生字注音資料</p>';
            }
        }

        // 🎨 渲染失敗畫面
        function renderFailure(jobId, reason) {
            const badge = document.getElementById(`badge-${jobId}`);
            const preview = document.getElementById(`preview-${jobId}`);
            if (!badge) return;

            badge.className = 'status-badge failed';
            badge.innerText = '分析失敗';
            preview.innerHTML += `<br><span style="color:#ef4444;">❌ 錯誤原因：${reason}</span>`;
        }
    </script>
</body>
</html>
